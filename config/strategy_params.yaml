# 七星ETF轮动超级增强V3 — 策略参数配置
#
# P3-E1: 架构统一
# 本文件从 scripts/run_qixing_v3.py 的硬编码常量提取而来，作为参数化配置的
# 单一事实来源 (single source of truth)。由 src/a_share_quant/strategies/params.py
# 的 StrategyParams 模型加载并校验。
#
# 规则概要 (聚宽 任侠 原版, 经参数扫描+稳健性验证):
#   1. 加权动量评分: 10日×0.5 + 20日×0.5 (扫描最佳, 非原版20/60/120)
#   2. 短期动量过滤: [关闭] 商品波动大, 误杀太多
#   3. 放量过滤: [关闭]
#   4. 单日跌幅过滤: 近5日有单日跌>3% → 排除 (保留, 防暴跌)
#   5. 盈利保护: [关闭] 创业板波动也>2%被误判, 伤2020
#   6. A股走弱回避: 创业板<MA15时, 排除创业板ETF (保守优化: MA20→MA15)
#   7. 全部不通过 → 切货币基金(511880)
#   8. 每5个交易日调仓, 持仓Top1 (非日频调仓)
#   9. 自适应换仓阈值: 强趋势快换(复利), 弱趋势慢换(防whipsaw)

version: "3.0.0"
name: "七星ETF轮动超级增强V3"
description: >
  跨资产ETF动量轮动策略：加权动量评分 + 单日跌幅过滤 + A股走弱回避，
  无通过时切货币基金防御。

# ---------------------------------------------------------------------------
# 标的池
# ---------------------------------------------------------------------------
universe:
  # 主交易ETF池 (code -> 名称)
  etf_pool:
    "518880": "黄金ETF"
    "159985": "豆粕ETF"
    "501018": "南方原油"
    "161226": "白银LOF"
    "513100": "纳指ETF"
    "159915": "创业板ETF"
    "511220": "城投债ETF"

  # 防御标的 (全部不通过时持有)
  defense: "511880"

  # A股代表标的 (用于A股走弱回避判断)
  a_share_etf: "159915"

  # 多类别ETF池 (原版核心: 动态切换, 当前关闭)
  categories:
    商品: ["518880", "159985", "501018", "161226"]   # 黄金/豆粕/原油/白银
    海外: ["513100"]                                  # 纳指
    A股: ["159915"]                                   # 创业板
    债券: ["511220"]                                  # 城投债

# ---------------------------------------------------------------------------
# 交易成本与调仓
# ---------------------------------------------------------------------------
trading:
  fee: 0.0005            # 单边手续费 (万五)
  slippage: 0.001        # 单边滑点
  rebalance_days: 5      # 调仓频率 (每5个交易日检查一次)
  switch_threshold: 0.02 # 参考: 原版换仓阈值 (实际使用自适应阈值)

# ---------------------------------------------------------------------------
# 动量评分
# ---------------------------------------------------------------------------
momentum:
  mom_weights: [0.5, 0.5]   # 动量权重 (必须求和≈1.0), 10日×0.5 + 20日×0.5
  mom_periods: [10, 20]     # 动量周期 (须与 mom_weights 等长)
  short_mom_days: 10        # 短期动量过滤窗口
  long_mom_period: 60       # 长周期动量过滤窗口 (仅对股票类)

# ---------------------------------------------------------------------------
# 过滤器参数
# ---------------------------------------------------------------------------
filters:
  vol_spike_ratio: 2.5       # 放量阈值 (当日量 > 5日均量 × 2.5 → 排除)
  drop_threshold: -0.03      # 单日跌幅阈值 (近N日有单日跌 < -3% → 排除)
  drop_lookback: 5           # 跌幅检查回看天数
  profit_protection_dd: 0.05 # 盈利保护回撤阈值 (5%)
  a_share_ma: 15             # A股走弱判断MA (保守优化: MA20→MA15, 更早回避)

# ---------------------------------------------------------------------------
# 功能开关
# ---------------------------------------------------------------------------
flags:
  use_short_mom_filter: false      # 短期动量过滤 (关闭: 商品波动大,误杀太多)
  use_vol_spike_filter: false      # 放量过滤 (关闭)
  use_drop_filter: true            # 单日跌幅过滤 (保留: 防暴跌)
  use_long_mom_filter: false       # 长周期趋势确认 (关闭: 过滤股票后商品回调被收割)
  use_profit_protection: false     # 盈利保护 (关闭: 创业板波动也>2%被误判,伤2020)
  use_a_share_filter: true         # A股走弱回避 (保留)
  use_bearish_day_filter: false    # 熊日过滤 (关闭: 上升趋势中阻止逢低买入,伤2020/2023)
  use_category_switch: false       # 多类别动态切换 (关闭: 过度偏向商品,伤2024/2025)

# ---------------------------------------------------------------------------
# 变更记录
# ---------------------------------------------------------------------------
changelog:
  - version: "3.0.0"
    date: "2026-07-31"
    note: >
      P3-E1 架构统一: 从 scripts/run_qixing_v3.py 提取硬编码常量至 YAML，
      新增 pydantic StrategyParams 校验模型与 load_params() 加载函数，
      建立 src/a_share_quant/strategies/qixing_v3.py 桥接模块支持渐进迁移。
