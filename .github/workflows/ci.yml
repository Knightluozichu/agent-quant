name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI only uses mock data - no real secrets
  DATA_PROVIDER: mock
  DRY_RUN: "true"
  ALLOW_LIVE_TRADING: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: mypy
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov=src/a_share_quant --cov-report=term-missing

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in tracked files
        run: |
          # Check for common secret patterns in tracked files
          ! git grep -iE '(password|token|secret|api_key)\s*=\s*["\x27][^"\x27]{8,}' -- ':!*.example' ':!*.md' || (echo "Potential secrets found!" && exit 1)
