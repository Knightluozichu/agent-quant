name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI only uses mock data - no real secrets
  DATA_PROVIDER: mock
  DRY_RUN: "true"
  ALLOW_LIVE_TRADING: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.py')
          if ((${#files[@]} == 0)); then
            echo "No Python files changed"
            exit 0
          fi
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: mypy (本次 PR 涉及的运行脚本)
        run: uv run mypy --ignore-missing-imports --follow-imports=skip scripts/notify.py scripts/sync_server_preview.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests (exclude integration) with coverage
        run: uv run pytest -m "not integration" --cov=src/a_share_quant --cov-report=term-missing

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in tracked files
        run: |
          # Check for common secret patterns in tracked files
          # 排除测试文件 (使用不匹配真实密钥格式的测试值) 和文档
          ! git grep -iE '(password|token|secret|api_key)\s*=\s*["\x27][^"\x27]{8,}' -- ':!*.example' ':!*.md' ':!tests/' ':!.github/' || (echo "Potential secrets found!" && exit 1)
