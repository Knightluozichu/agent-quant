<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>七星V4 实盘记账</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fdfdfd; --line:#e6e8ec; --txt:#1b1f26; --muted:#7d8590;
    --accent:#3461d6; --up:#d6453d; --down:#1a9e56; --warn:#c77400;
    --warn-bg:rgba(199,116,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131519; --card:#1b1e24; --line:#2b2f37; --txt:#e8eaee; --muted:#8b929d;
      --accent:#6b8af0; --up:#ec6560; --down:#3fbf7f; --warn:#e09b3c;
      --warn-bg:rgba(224,155,60,.12);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
  .wrap{max-width:1060px;margin:0 auto;padding:14px 14px 32px}
  h1{font-size:17px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-width:0}
  .c5{grid-column:span 5}.c7{grid-column:span 7}.c12{grid-column:span 12}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:500;
    letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
  .muted{color:var(--muted)}
  .big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;line-height:1.15}
  .up{color:var(--up)} .down{color:var(--down)}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(52,97,214,.1);color:var(--accent)}
  .tag.pending{background:var(--warn-bg);color:var(--warn)}
  .tag.hold{background:rgba(26,158,86,.12);color:var(--down)}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;background:var(--bg);color:var(--txt)}
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{width:100%;padding:11px;border:none;border-radius:10px;font-size:15px;font-weight:600;
    background:var(--accent);color:#fff;margin-top:12px;cursor:pointer;transition:opacity .15s}
  button:active{opacity:.85}
  button:disabled{opacity:.5}
  button.ghost{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  button.sm{width:auto;padding:6px 14px;font-size:13px;margin:0}
  .card.pending-live{border:1px solid var(--warn);background:var(--warn-bg)}
  .board-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .board-row:last-child{border-bottom:none}
  .board-rank{width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
  .board-rank.top{background:var(--up);color:#fff}
  .board-name{flex:1}
  .board-score{font-weight:600;font-variant-numeric:tabular-nums}
  .scrollbox{max-height:320px;overflow-y:auto}
  #board{max-height:none;overflow:visible}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .hidden{display:none}
  .alert{padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
  .alert.warn{background:var(--warn-bg);color:var(--warn)}
  .alert.ok{background:rgba(26,158,86,.1);color:var(--down)}
  .chk{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:14px;color:var(--txt)}
  .chk input{width:auto}
  .chart-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--txt);
    color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:99}
  .toast.show{opacity:.95}
  .pill{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
  .login-wrap{max-width:400px;margin:0 auto;padding-top:18vh}
  @media (max-width:820px){
    .c5,.c7{grid-column:span 12}
    .big{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div id="login" class="login-wrap hidden">
    <h1>七星V4 实盘记账</h1>
    <div class="sub" style="margin:4px 0 14px">填入真实成交, 让持仓状态等于现实</div>
    <div class="card">
      <label>访问密码</label>
      <input id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
      <button onclick="doLogin()">登 录</button>
      <div id="loginErr" class="alert warn hidden" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <div class="row">
      <div>
        <h1>七星V4 实盘记账</h1>
        <div class="sub" id="dateLine">—</div>
      </div>
      <button class="ghost sm" onclick="doLogout()">退出</button>
    </div>

    <div class="grid">

      <!-- 待确认信号 (置顶, 全宽) -->
      <div id="pendingCard" class="card c12 pending-live hidden">
        <h2>待确认信号 <span class="tag pending" id="pendingDate"></span></h2>
        <div id="pendingReason" class="muted" style="margin-bottom:8px"></div>

        <div id="sellBlock" class="hidden">
          <div class="chk"><input type="checkbox" id="sellOn" checked><b>① 卖出 <span id="sellName"></span></b></div>
          <div class="grid2">
            <div><label>数量(股)</label><input id="sellShares" type="number" inputmode="numeric"></div>
            <div><label>成交价</label><input id="sellPrice" type="number" inputmode="decimal" step="0.001"></div>
          </div>
        </div>

        <div id="buyBlock" class="hidden">
          <div class="chk"><input type="checkbox" id="buyOn" checked><b>② 买入</b></div>
          <label>标的</label><select id="buyCode"></select>
          <div class="grid2">
            <div><label>数量(股)</label><input id="buyShares" type="number" inputmode="numeric"></div>
            <div><label>成交价</label><input id="buyPrice" type="number" inputmode="decimal" step="0.001"></div>
          </div>
        </div>

        <button id="confirmButton" onclick="doConfirm()">确认成交 (填入真实数据)</button>
        <button class="ghost" onclick="doSkip()">本次不操作</button>
      </div>

      <!-- 账户概览 -->
      <div class="card c5">
        <h2>账户 <span class="tag" id="retTag"></span></h2>
        <div class="big" id="totalVal">—</div>
        <div class="row" style="margin-top:8px"><span class="muted">可用现金</span><span id="cashVal" class="kimi-number">—</span></div>
        <div class="row"><span class="muted">当前持仓</span><span id="holdVal">—</span></div>
        <div id="feeSummary" class="alert warn hidden" style="margin-top:10px;margin-bottom:0"></div>
      </div>

      <!-- 信号 -->
      <div class="card c7">
        <h2>V4 官方决策 <span class="pill">14:50 快照</span></h2>
        <div id="targetLine" class="alert ok"></div>
        <div id="board" class="scrollbox"></div>
      </div>

      <!-- 收益曲线 -->
      <div class="card c7">
        <h2>账户净值</h2>
        <div id="chart"></div>
      </div>

      <!-- 历史 -->
      <div class="card c5">
        <h2>历史成交</h2>
        <div id="historyBox" class="scrollbox"></div>
      </div>

      <!-- 手动记账 -->
      <div class="card c5">
        <h2>手动记账 <span class="pill">修正或非信号交易</span></h2>
        <label>操作</label>
        <select id="mAction"><option value="buy">买入</option><option value="sell">卖出</option></select>
        <label>标的</label><select id="mCode"></select>
        <div class="grid2">
          <div><label>数量(股)</label><input id="mShares" type="number" inputmode="numeric"></div>
          <div><label>成交价</label><input id="mPrice" type="number" inputmode="decimal" step="0.001"></div>
        </div>
        <label>日期 (留空=今天)</label><input id="mDate" type="date">
        <button onclick="doManual()">记 录</button>
      </div>

      <!-- 策略全景 (滚到才加载, 回测计算重) -->
      <div class="card c7" id="overviewCard">
        <h2>策略全景 <span class="pill" id="ovPeriod"></span></h2>
        <div id="ovScope" class="alert warn hidden"></div>
        <div id="ovMetrics"><div class="muted">滚动到此处自动计算回测…</div></div>
        <div class="muted" style="font-size:12px;margin:12px 0 6px">净值曲线 (对数) 与回撤</div>
        <div id="ovEquity"></div>
        <div class="muted" style="font-size:12px;margin:12px 0 6px">逐年收益</div>
        <div id="ovYearly"></div>
        <div class="muted" style="font-size:12px;margin:12px 0 6px">持仓时间线</div>
        <div id="ovHoldings"></div>
      </div>

    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const RED='#d6453d', GREEN='#1a9e56';
const ETF_COLORS={"518880":"#E6B800","159985":"#A0522D","501018":"#2F4F4F","161226":"#9099A0","513100":"#3B6FE0","159915":"#FF6347","511220":"#2E9E5B","511880":"#C8CDD3"};
let ETFS = [];
let latestStatus = null;

function fmt(x){ return (x==null?'—':Number(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

async function api(path, opts={}){
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  opts.credentials = 'same-origin';  // 自动发送 HttpOnly cookie
  const r = await fetch(path, opts);
  if(r.status===401){ logout(); throw new Error('未授权'); }
  const data = await r.json();
  if(!r.ok) throw new Error(data.detail || ('请求失败 '+r.status));
  return data;
}

// ---------- 登录 ----------
function showLogin(){ document.getElementById('login').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
async function doLogin(){
  const pwd=document.getElementById('pwd').value;
  const err=document.getElementById('loginErr');
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({password:pwd})});
    err.classList.add('hidden'); enterApp();
  }catch(e){ err.textContent=e.message; err.classList.remove('hidden'); }
}
function logout(){ showLogin(); }
async function doLogout(){
  try{ await api('/api/logout',{method:'POST'}); }catch(e){}
  showLogin();
}

// ---------- 进入主界面 ----------
async function enterApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  try{
    const etfData=await api('/api/etfs'); ETFS=etfData.etfs; fillEtfSelects();
    await loadAll();
    watchOverview();
  }catch(e){ toast(e.message); }
}

function fillEtfSelects(){
  const opts=ETFS.map(e=>`<option value="${e.code}">${e.name} (${e.code})</option>`).join('');
  document.getElementById('buyCode').innerHTML=opts;
  document.getElementById('mCode').innerHTML=opts;
}

async function loadAll(){
  const [status, signal, history, equity] = await Promise.all([
    api('/api/status'), api('/api/signal'), api('/api/history'), api('/api/equity')
  ]);
  latestStatus = status;
  renderStatus(status); renderPending(status.pending_order);
  renderFeeSummary(history.trades);
  renderSignal(signal); renderHistory(history.trades); renderEquity(equity);
  let dateTxt=(status.strategy_mode||'V4')+' · 数据截至 '+status.trade_date;
  if(status.holding){ dateTxt += status.realtime?' · 市值实时估算':' · 市值按收盘估算'; }
  document.getElementById('dateLine').textContent=dateTxt;
}

function renderFeeSummary(trades){
  const el=document.getElementById('feeSummary');
  const t=(trades||[]).find(x=>x && x.commission!=null);
  if(!t){ el.classList.add('hidden'); return; }
  const fee=Number(t.commission);
  const gross=t.gross_amount!=null?Number(t.gross_amount):null;
  const cashImpact=Number(t.amount);
  const action=t.action==='sell'?'卖出':'买入';
  const time=t.execution_time?
    String(t.execution_time).replace('T',' ').slice(0,16):String(t.date||'');
  const grossLine=gross!=null?`成交额 ¥${fmt(gross)} · `:'';
  const cashLabel=t.action==='sell'?'现金到账':'现金扣减';
  el.innerHTML=`<b>最近成交费用 ¥${fmt(fee)}</b><br>
    <span class="muted">${time} ${action}${t.name||t.code} ${Number(t.shares).toLocaleString('zh-CN')}份 @ ${Number(t.price).toFixed(3)} · ${grossLine}${cashLabel} ¥${fmt(cashImpact)}<br>
    手续费已计入现金口径，持仓成本仍按 ¥${Number(t.price).toFixed(3)} 展示</span>`;
  el.classList.remove('hidden');
}

// ---------- 渲染 ----------
function renderStatus(s){
  if(!s.initialized){ document.getElementById('totalVal').textContent='账户未初始化'; return; }
  document.getElementById('totalVal').textContent='¥'+fmt(s.total);
  const up=s.return_pct>=0;
  const tag=document.getElementById('retTag');
  tag.textContent=(up?'+':'')+s.return_pct+'%'; tag.style.color=up?RED:GREEN;
  document.getElementById('cashVal').textContent='¥'+fmt(s.cash);
  if(s.holding){
    const h=s.holding;
    if(h.price_stale){
      document.getElementById('holdVal').innerHTML=
        `${h.name} ${h.shares}股 <span class="muted">盈亏待数据更新</span>`;
    }else{
      const hu=h.pnl_pct>=0;
      document.getElementById('holdVal').innerHTML=
        `${h.name} ${h.shares}股 <span style="color:${hu?RED:GREEN}">${hu?'+':''}${h.pnl_pct}%</span>`;
    }
  }else{
    document.getElementById('holdVal').innerHTML='<span class="muted">空仓 (货币基金)</span>';
  }
}

function renderPending(p){
  const card=document.getElementById('pendingCard');
  if(!p || p.status!=='pending'){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  document.getElementById('pendingDate').textContent=p.date;
  document.getElementById('pendingReason').textContent=(p.reason||'');
  // 卖出
  const sb=document.getElementById('sellBlock');
  if(p.sell){
    sb.classList.remove('hidden');
    document.getElementById('sellName').textContent=`${p.sell.name} (${p.sell.code})`;
    document.getElementById('sellShares').value=p.sell.shares;
    document.getElementById('sellPrice').value=p.sell.price;
  }else sb.classList.add('hidden');
  // 买入
  const bb=document.getElementById('buyBlock');
  if(p.buy){
    bb.classList.remove('hidden');
    document.getElementById('buyCode').value=p.buy.code;
    document.getElementById('buyShares').value=p.buy.shares;
    document.getElementById('buyPrice').value=p.buy.price;
  }else bb.classList.add('hidden');
}

function renderSignal(sig){
  if(!sig.target){ document.getElementById('targetLine').textContent=sig.reason||'暂无官方信号'; return; }
  const t=sig.target;
  const board=sig.board||[];
  const confirms=sig.confirmation_required?
    ` · 共振确认 ${sig.confirmation_hits||0}/${sig.confirmation_required}`:'';
  const source=sig.official?' · 官方快照':' · 实时预览';
  document.getElementById('targetLine').innerHTML =
    `V4目标: <b>${t.name} (${t.code})</b>${confirms}${source}` + (sig.a_share_weak?' · A股走弱防御':'');
  const html=`<div class="board-row" style="padding:4px 0 6px"><div style="width:20px"></div><div class="board-name muted" style="font-size:11px">ETF (代码)</div><div class="board-score muted" style="font-size:11px;font-weight:400">动量(10+20日)</div></div>`+
  board.map((b,i)=>{
    const cls=b.score>=0?'up':'down';
    const rank=i===0&&b.eligible?'board-rank top':'board-rank';
    let mark='';
    if(b.is_holding) mark+='<span class="tag hold">持仓</span>';
    if(b.is_target) mark+='<span class="tag">目标</span>';
    if(b.dropped) mark+='<span class="pill">急跌过滤</span>';
    return `<div class="board-row">
      <div class="${rank}">${i+1}</div>
      <div class="board-name">${b.name}<br><span class="muted" style="font-size:11px">${b.code} ${mark}</span></div>
      <div class="board-score ${cls}">${b.score>=0?'+':''}${b.score}%</div>
    </div>`;
  }).join('');
  document.getElementById('board').innerHTML=html;
}

function renderHistory(trades){
  const box=document.getElementById('historyBox');
  if(!trades.length){ box.innerHTML='<div class="muted">暂无成交记录</div>'; return; }
  let rows=trades.map(t=>{
    const sell=t.action==='sell';
    const feeLine=t.commission!=null?`<span class="muted">手续费 ¥${fmt(t.commission)}</span>`:'';
    const grossLine=t.gross_amount!=null?`<span class="muted">成交额 ¥${fmt(t.gross_amount)}</span>`:'';
    return `<tr><td>${t.date.slice(5)}<br><span class="muted">${sell?'卖出':'买入'}</span></td>
      <td>${t.name}</td>
      <td class="num">${t.shares}股<br><span class="muted">@${t.price.toFixed(3)}</span></td>
      <td class="num">${sell?'+':'-'}${fmt(t.amount)}<br>${grossLine}${feeLine}</td></tr>`;
  }).join('');
  box.innerHTML=`<table><tr><th>日期</th><th>标的</th><th style="text-align:right">数量</th><th style="text-align:right">现金影响</th></tr>${rows}</table>`;
}

function renderEquity(eq){
  const el=document.getElementById('chart');
  const curve=eq.curve, init=eq.initial_capital;
  if(!curve.length){ el.innerHTML='<div class="muted">暂无成交记录, 确认第一笔交易后显示</div>'; return; }
  const w=340,h=180,pad=10;
  const vals=curve.map(c=>c.value);
  const min=Math.min(...vals,init), max=Math.max(...vals,init), range=(max-min)||1;
  const n=curve.length;
  const pts=curve.map((c,i)=>{
    const x=pad+(i/Math.max(n-1,1))*(w-2*pad);
    const y=h-pad-((c.value-min)/range)*(h-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  const last=curve[n-1].value, ret=((last/init-1)*100).toFixed(1);
  const color=last>=init?RED:GREEN;
  const baseY=(h-pad-((init-min)/range)*(h-2*pad)).toFixed(1);
  el.innerHTML=`<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <line x1="${pad}" y1="${baseY}" x2="${w-pad}" y2="${baseY}" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3"/>
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.join(' ')}"/>
  </svg>
  <div class="chart-labels"><span>${curve[0].date}</span>
    <span style="color:${color};font-weight:600">最新 ¥${fmt(last)} (${ret}%)</span>
    <span>${curve[n-1].date}</span></div>`;
}

// ---------- 策略全景 ----------
let ovLoaded=false;
async function loadOverview(){
  const box=document.getElementById('ovMetrics');
  box.innerHTML='<div class="muted">正在计算回测…</div>';
  try{
    const d=await api('/api/backtest');
    renderOverview(d); ovLoaded=true;
  }
  catch(e){ box.innerHTML='<div class="muted">加载失败: '+e.message+'</div>'; }
}
function renderOverview(d){
  const m=d.metrics;
  const liveMode=latestStatus&&latestStatus.strategy_mode?latestStatus.strategy_mode:'未知';
  const liveId=latestStatus&&latestStatus.strategy_id?latestStatus.strategy_id:'';
  const scope=document.getElementById('ovScope');
  scope.innerHTML=
    `当前实盘：<b>${liveMode}</b>${liveId?` <span class="muted">(${liveId})</span>`:''}<br>`+
    `下方历史图：<b>V3-G 基线回测</b>，仅作基准对照，不代表 V4 的历史绩效。`;
  scope.classList.remove('hidden');
  document.getElementById('ovPeriod').textContent=m.start+' ~ '+m.end+' · '+m.years+'年';
  document.getElementById('ovMetrics').innerHTML=
    '<div class="grid2" style="grid-template-columns:repeat(3,1fr)">'+
    cell('累计收益','+'+m.total_return+'%','up')+cell('年化收益','+'+m.ann_return+'%','up')+
    cell('夏普比率',m.sharpe,'')+cell('最大回撤',m.max_drawdown+'%','down')+
    cell('交易次数',m.n_trades,'')+cell('回测年限',m.years+'年','')+'</div>';
  drawOvEquity(d.dates,d.values,d.drawdown);
  drawOvYearly(d.yearly);
  drawOvHoldings(d.dates,d.holdings,d.etf_names);
}
function cell(label,val,cls){return '<div><div class="muted" style="font-size:12px">'+label+'</div><b class="'+cls+'" style="font-size:18px">'+val+'</b></div>';}
function drawOvEquity(dates,values,dd){
  const el=document.getElementById('ovEquity');
  const w=340,h=150,pad=8,n=values.length;
  const lv=values.map(v=>Math.log10(v));
  const lmin=Math.min(...lv),lmax=Math.max(...lv),lr=(lmax-lmin)||1;
  const pts=values.map((v,i)=>(pad+(i/Math.max(n-1,1))*(w-2*pad)).toFixed(1)+','+(h-pad-((Math.log10(v)-lmin)/lr)*(h-2*pad)).toFixed(1));
  const dh=46,dmin=Math.min(...dd,0),dr=(0-dmin)||1;
  const baseY=(dh-pad-((0-dmin)/dr)*(dh-2*pad)).toFixed(1);
  const dpts=dd.map((v,i)=>(pad+(i/Math.max(n-1,1))*(w-2*pad)).toFixed(1)+','+(dh-pad-((v-dmin)/dr)*(dh-2*pad)).toFixed(1));
  el.innerHTML='<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block">'+
    '<polyline fill="none" stroke="'+RED+'" stroke-width="1.8" points="'+pts.join(' ')+'"/></svg>'+
    '<div class="chart-labels"><span>'+dates[0]+'</span><span class="muted">净值(对数)</span><span>'+dates[n-1]+'</span></div>'+
    '<svg width="100%" viewBox="0 0 '+w+' '+dh+'" preserveAspectRatio="none" style="display:block;margin-top:4px">'+
    '<line x1="'+pad+'" y1="'+baseY+'" x2="'+(w-pad)+'" y2="'+baseY+'" stroke="#ddd" stroke-width="1"/>'+
    '<polygon fill="'+GREEN+'" fill-opacity="0.35" points="'+pad+','+baseY+' '+dpts.join(' ')+' '+(w-pad)+','+baseY+'"/></svg>'+
    '<div class="chart-labels"><span></span><span class="muted">回撤(最深 '+Math.min(...dd).toFixed(1)+'%)</span><span></span></div>';
}
function drawOvYearly(yearly){
  const el=document.getElementById('ovYearly');
  const w=340,h=140,pad=18;
  const rets=yearly.map(y=>y.return);
  const max=Math.max(...rets,0),min=Math.min(...rets,0),range=(max-min)||1;
  const bw=(w-2*pad)/yearly.length;
  const zeroY=h-pad-((0-min)/range)*(h-2*pad);
  let bars='';
  yearly.forEach((y,i)=>{
    const x=pad+i*bw+bw*0.15,bwid=bw*0.7;
    const yv=h-pad-((y.return-min)/range)*(h-2*pad);
    const top=Math.min(yv,zeroY),bh=Math.abs(yv-zeroY);
    const color=y.return>=0?RED:GREEN;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'"/>';
    bars+='<text x="'+(x+bwid/2).toFixed(1)+'" y="'+(top-3).toFixed(1)+'" font-size="8" fill="#666" text-anchor="middle">'+(y.return>0?'+':'')+y.return+'</text>';
    bars+='<text x="'+(x+bwid/2).toFixed(1)+'" y="'+(h-4)+'" font-size="8" fill="#999" text-anchor="middle">'+y.year+'</text>';
  });
  el.innerHTML='<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="display:block">'+
    '<line x1="'+pad+'" y1="'+zeroY.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zeroY.toFixed(1)+'" stroke="#ccc" stroke-width="1"/>'+bars+'</svg>';
}
function drawOvHoldings(dates,holdings,names){
  const el=document.getElementById('ovHoldings');
  const w=340,h=24,pad=2,n=holdings.length,cw=(w-2*pad)/n;
  let rects='';
  holdings.forEach((c,i)=>{rects+='<rect x="'+(pad+i*cw).toFixed(2)+'" y="2" width="'+(cw+0.3).toFixed(2)+'" height="'+(h-4)+'" fill="'+(ETF_COLORS[c]||'#ccc')+'"/>';});
  const seen=[...new Set(holdings)];
  const legend=seen.map(c=>'<span style="display:inline-flex;align-items:center;margin:2px 8px 2px 0;font-size:11px">'+
    '<span style="width:10px;height:10px;background:'+(ETF_COLORS[c]||'#ccc')+';display:inline-block;border-radius:2px;margin-right:3px"></span>'+(names[c]||c)+'</span>').join('');
  el.innerHTML='<svg width="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block;border-radius:4px;overflow:hidden">'+rects+'</svg>'+
    '<div style="margin-top:8px;line-height:1.6">'+legend+'</div>'+
    '<div class="chart-labels"><span>'+dates[0]+'</span><span></span><span>'+dates[n-1]+'</span></div>';
}

// ---------- 操作 ----------
async function doConfirm(){
  const p=curPending; if(!p) return;
  const payload={sell:null,buy:null,order_id:p.order_id||null,
    expected_state_version:p.expected_state_version??null,
    idempotency_key:(crypto.randomUUID?crypto.randomUUID():String(Date.now()))};
  if(p.sell && document.getElementById('sellOn').checked){
    payload.sell={shares:+document.getElementById('sellShares').value, price:+document.getElementById('sellPrice').value};
  }
  if(p.buy && document.getElementById('buyOn').checked){
    payload.buy={code:document.getElementById('buyCode').value, shares:+document.getElementById('buyShares').value, price:+document.getElementById('buyPrice').value};
  }
  if(!payload.sell && !payload.buy){ toast('请至少勾选一笔成交'); return; }
  const btn=document.getElementById('confirmButton'); btn.disabled=true;
  try{ await api('/api/confirm',{method:'POST',body:JSON.stringify(payload)}); toast('已确认成交'); await loadAll(); }
  catch(e){ toast(e.message); }
  finally{ btn.disabled=false; }
}
async function doSkip(){
  if(!confirm('确认本次不操作? 信号将标记为已跳过。')) return;
  try{ await api('/api/skip',{method:'POST'}); toast('已标记为不操作'); await loadAll(); }
  catch(e){ toast(e.message); }
}
async function doManual(){
  const payload={action:document.getElementById('mAction').value, code:document.getElementById('mCode').value,
    shares:+document.getElementById('mShares').value, price:+document.getElementById('mPrice').value,
    date:document.getElementById('mDate').value||null};
  if(!payload.shares||!payload.price){ toast('请填写数量和价格'); return; }
  try{ await api('/api/trade',{method:'POST',body:JSON.stringify(payload)}); toast('已记录');
    document.getElementById('mShares').value=''; document.getElementById('mPrice').value=''; await loadAll(); }
  catch(e){ toast(e.message); }
}

// 保存当前 pending 供确认时使用
let curPending=null;
const _renderPending=renderPending;
renderPending=function(p){ curPending=p; _renderPending(p); };

// 策略全景: 滚到卡片附近才触发回测计算 (替代原来的点击 Tab 加载)
function watchOverview(){
  const card=document.getElementById('overviewCard');
  if(!('IntersectionObserver' in window)){ return; }
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting && !ovLoaded){ loadOverview(); io.disconnect(); } });
  },{rootMargin:'240px'});
  io.observe(card);
}

// 启动: 检查 cookie 是否仍有效 (已登录则直接进入主界面)
(async()=>{
  try{
    await api('/api/etfs');  // 需要 token 的轻量接口, 验证 cookie 是否有效
    enterApp();
  }catch(e){
    showLogin();
  }
})();
