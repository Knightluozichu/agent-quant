[project]
name = "a-share-quant"
version = "0.1.0"
description = "A股家庭量化活体：日频量化系统，支持市场状态识别、策略路由、风控和受控进化"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # Data computation
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    # Local analytical database
    "duckdb>=1.0",
    # Statistics
    "scipy>=1.13",
    "statsmodels>=0.14",
    # Traditional ML
    "scikit-learn>=1.5",
    # Configuration
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Logging
    "structlog>=24.2",
    # Charts and reports
    "plotly>=5.22",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    # HTTP requests (实时行情接口)
    "requests>=2.31",
    "xgboost>=3.4.0",
    "lightgbm>=4.7.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "fastapi>=0.139.2",
]

[project.optional-dependencies]
data-joinquant = [
    "jqdatasdk>=1.9",
]
data-tushare = [
    "tushare>=1.4",
]
data-akshare = [
    "akshare>=1.14",
]
viz = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
]
server = [
    # fastapi 已在主依赖 (trade_server 生产运行必需)
    "uvicorn[standard]>=0.30",
]

# 开发依赖: dependency-groups 使 `uv sync` 默认安装 (无需 --extra dev)
# 生产服务器用 `uv sync --no-default-groups --extra ...` 排除
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "httpx>=0.28.1",
]

[project.scripts]
quant = "a_share_quant.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a_share_quant"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific
]
ignore = [
    "S101",  # assert used in tests
    "S104",  # bind to all interfaces (dev only)
    "S311",  # pseudo-random in non-security context
    "ARG002", # unused method argument (Protocol implementations)
    "RUF001", # ambiguous unicode char in string (Chinese text is intentional)
    "RUF002", # ambiguous unicode char in docstring (Chinese text is intentional)
    "RUF003", # ambiguous unicode char in comment (Chinese text is intentional)
]

[tool.ruff.lint.isort]
known-first-party = ["a_share_quant"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "DTZ"]
"scripts/**" = [
    "T201",   # print found (CLI tools use print intentionally)
    "S108",   # insecure temp file (lock file in /tmp is intentional)
    "DTZ",    # datetime timezone (TZ set via env var Asia/Shanghai)
    "PTH123", # open() vs Path.open() (acceptable in scripts)
    "RUF001", # ambiguous unicode char in string (Chinese text is intentional)
    "RUF002", # ambiguous unicode char in docstring (Chinese text is intentional)
    "S310",   # suspicious url open (known safe data sources)
]
# 研究/实验脚本 (exp_*、run_*、archive_*、strategy_lab 等一次性分析代码):
# 实验结果已归档, 放宽纯风格规则; 正确性规则 (F841/F401/F811 等) 仍全量强制。
# 生产脚本 (live_signal/trade_server/notify/daily_calibrate/sync_server_preview 等)
# 不在下列 glob 内, 保持全规则门禁。决策见 tasks/DECISIONS.md 2026-08-17。
"scripts/exp_*.py" = [
    "N803", "N806", "E501", "E402", "ARG001", "B007", "B905",
    "RUF005", "RUF059", "SIM102", "SIM108", "SIM103", "RET504",
    "C401", "C416", "UP031", "UP042", "TC001", "TC002", "TC003",
    "S110", "E741", "C408",
]
"scripts/run_*.py" = [
    "N803", "N806", "E501", "E402", "ARG001", "B007", "B905",
    "RUF005", "RUF059", "SIM102", "SIM108", "SIM103", "RET504",
    "C401", "C416", "UP031", "UP042", "TC001", "TC002", "TC003",
    "S110", "E741", "C408",
]
"scripts/archive_*.py" = [
    "N803", "N806", "E501", "E402", "ARG001", "B007", "B905",
    "RUF005", "RUF059", "SIM102", "SIM108", "SIM103", "RET504",
    "C401", "C416", "UP031", "UP042", "TC001", "TC002", "TC003",
    "S110", "E741", "C408",
]
"scripts/strategy_lab/*.py" = [
    "N803", "N806", "E501", "E402", "ARG001", "B007", "B905",
    "RUF005", "RUF059", "SIM102", "SIM108", "SIM103", "RET504",
    "C401", "C416", "UP031", "UP042", "TC001", "TC002", "TC003",
    "S110", "E741", "C408",
]
"scripts/plot_strategy.py" = ["E501", "ARG001", "C408"]
"scripts/next_rebalance.py" = ["E501", "ARG001", "C408"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "jqdatasdk.*",
    "tushare.*",
    "akshare.*",
    "plotly.*",
    "statsmodels.*",
]
ignore_missing_imports = true

# scripts/ 是 CLI 脚本, 使用 sys.path.insert 而非正式包结构
# 放宽类型检查: 允许无类型参数的 dict, 允许无注解的 main()
[[tool.mypy.overrides]]
module = ["run_qixing_v3", "live_signal", "trade_server", "notify", "daily_calibrate", "risk_overrides"]
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["type-arg", "no-untyped-call", "no-untyped-def", "attr-defined"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests (Hypothesis)",
    "golden: Golden scenario tests",
    "regression: Regression tests",
    "slow: Slow tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/a_share_quant"]
branch = true
# Visualization is optional and is not part of the headless CI test surface.
omit = ["src/a_share_quant/viz/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@abstractmethod",
]
# Current non-integration baseline after excluding optional visualization code.
fail_under = 55
